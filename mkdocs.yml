site_name: AI Agent for QGIS
site_description: An AI agent inside QGIS 4 — inspects your project and processes data from a plain-language request.
site_url: https://mzarov.github.io/qgis-ai-agent/
repo_url: https://github.com/mzarov/qgis-ai-agent
repo_name: mzarov/qgis-ai-agent

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      toggle:
        icon: material/weather-night
        name: Dark theme
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      toggle:
        icon: material/weather-sunny
        name: Light theme
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences

plugins:
  - search
  - i18n:
      docs_structure: suffix
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: ru
          name: Русский
          build: true
          site_description: ИИ-агент внутри QGIS 4 — изучает проект и обрабатывает данные по запросу на естественном языке.
          nav_translations:
            Home: Главная
            Setup: Установка
            Data and privacy: Данные и конфиденциальность
            Usage: Использование
            Architecture: Архитектура
            Development: Разработка
            Translations: Переводы
            Smoke checklist: Смоук-чеклист
            Roadmap: План развития

nav:
  - Home: index.md
  - Setup: SETUP.md
  - Data and privacy: privacy.md
  - Usage: usage.md
  - Architecture: core_architecture.md
  - Development:
      - Translations: translations.md
      - Smoke checklist: smoke_checklist.md
  - Roadmap: roadmap.md
