[project]
name = "qgis-ai-agent"
version = "0.1.0"
description = "QGIS 4 plugin: an AI agent with tools for reading the project and processing data"
authors = [{ name = "mzarov", email = "mzarov@duck.com" }]
requires-python = ">=3.12,<4.0"

[tool.poetry]
package-mode = false

[tool.poetry.group.dev.dependencies]
ruff = "^0.13"
pre-commit = "^4.0"
mypy = "^2.3.1"
bandit = "1.9.4"
detect-secrets = "1.5.0"
coverage = "^7.16.0"

[tool.poetry.group.docs]
optional = true

[tool.poetry.group.docs.dependencies]
mkdocs-material = "^9.7.7"
mkdocs-static-i18n = "^1.3.1"

[tool.ruff]
line-length = 120
target-version = "py312"
exclude = ["dist", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4"]
ignore = ["SIM105", "SIM108", "SIM110"]

[tool.ruff.lint.per-file-ignores]
"ai_agent/__init__.py" = ["E402"]
"tests/*" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["ai_agent"]

[tool.mypy]
python_version = "3.12"
strict = true
files = [
    "ai_agent/config",
    "ai_agent/skills",
    "ai_agent/qgis_tools/base.py",
    "ai_agent/qgis_tools/common/validation.py",
    "ai_agent/qgis_tools/processing/effects.py",
]
follow_imports = "silent"
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["qgis.*"]
ignore_missing_imports = true

[tool.coverage.run]
branch = true
source = ["ai_agent"]
relative_files = true

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.coverage.html]
directory = "build/coverage"

[tool.coverage.xml]
output = "build/coverage.xml"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
