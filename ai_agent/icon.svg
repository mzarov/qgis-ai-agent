<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- The plugin icon: the compass mark in white on the brand blue, one file for both QGIS themes.
       The mark is 88 px on the 24-unit grid of ui/compass.py (scale 88/24), needle at rest (45°). -->
  <rect x="0" y="0" width="128" height="128" rx="28" fill="#1F6FB2"/>
  <g transform="translate(20 20) scale(3.6666667)">
    <path d="M20.21 9.8A8.5 8.5 0 1 1 14.2 3.79" fill="none" stroke="#FFFFFF" stroke-width="1.9" stroke-linecap="round"/>
    <g transform="rotate(45 12 12)">
      <polygon points="12,1.2 14.7,12 12,18.6 9.3,12" fill="#1F6FB2" stroke="#1F6FB2" stroke-width="2.3" stroke-linejoin="round"/>
      <polygon points="9.9,12 14.1,12 12,17.7" fill="#1F6FB2" stroke="#FFFFFF" stroke-width="1.3" stroke-linejoin="round"/>
      <polygon points="12,1.6 14.5,12 9.5,12" fill="#FFFFFF"/>
      <circle cx="12" cy="12" r="0.9" fill="#1F6FB2"/>
    </g>
  </g>
</svg>
