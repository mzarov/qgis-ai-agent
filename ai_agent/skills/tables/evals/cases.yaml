# tables: with the skill loaded, the model's CSV call.
# `expect` is checked by evals/checks.py; see docs/skill_evals.md.

- description: A file is looked at before loading
  vars:
    request: Load /data/stops.csv as points
    expect:
      call: [preview_table, load_table]
      args: {path: /data/stops.csv}

- description: Points from lon/lat columns
  vars:
    request: Load /data/stops.csv as points
    reads:
      steps:
        - tool: preview_table
          args: {path: /data/stops.csv}
          # The shape preview_table returns: rows are lists of cells, in column order.
          result:
            path: /data/stops.csv
            delimiter: comma
            encoding: utf-8
            row_count: 214
            columns: [{name: stop_id, type: integer}, {name: name, type: string}, {name: lon, type: real}, {name: lat, type: real}]
            rows: [["1", Tverskaya, "37.6056", "55.7647"], ["2", Pushkinskaya, "37.6043", "55.7656"], ["3", Okhotny Ryad, "37.6153", "55.7576"]]
    expect:
      call: load_table
      args: {path: /data/stops.csv, x_field: lon, y_field: lat}

- description: Projected columns keep their CRS
  vars:
    request: Load /data/wells.csv, the coordinates are x and y in UTM zone 37N
    reads:
      steps:
        - tool: preview_table
          args: {path: /data/wells.csv}
          result:
            path: /data/wells.csv
            delimiter: semicolon
            encoding: utf-8
            row_count: 38
            columns: [{name: well, type: string}, {name: x, type: real}, {name: y, type: real}]
            rows: [[W-1, "412345.0", "6178123.0"], [W-2, "412910.5", "6177804.2"], [W-3, "413377.0", "6178650.9"]]
    expect:
      call: load_table
      args: {x_field: x, y_field: y, crs: "re:32637"}

- description: A join by a shared key
  vars:
    request: Attach /data/population.csv to the districts by the district name
    reads:
      steps:
        - tool: preview_table
          args: {path: /data/population.csv}
          # Enough rows to compare the names with the layer's: a single row sent the model back for more.
          result:
            path: /data/population.csv
            delimiter: comma
            encoding: utf-8
            row_count: 12
            columns: [{name: district, type: string}, {name: population_2024, type: integer}]
            rows: [[Arbat, "37010"], [Basmanny, "113420"], [Khamovniki, "110660"], [Meshchansky, "59750"], [Presnensky, "128510"], [Tagansky, "122830"]]
        - tool: describe_layer
          args: {layer_name: districts}
          result: {name: districts, kind: vector, geometry: polygon, fields: [{name: name, type: String}, {name: pop2020, type: Integer64}]}
        # The skill compares name keys before joining; the case starts after that comparison.
        - tool: get_field_values
          args: {layer_name: districts, field_name: name}
          result: {field: name, unique_values: [Arbat, Basmanny, Khamovniki, Meshchansky, Presnensky, Tagansky], count: 12}
    expect:
      call: join_table
      args: {layer_name: districts, layer_field: name, table: /data/population.csv, table_field: district}

- description: Listing joins
  vars:
    request: Which tables are joined to the districts?
    expect:
      call: list_joins
      args: {layer_name: districts}
