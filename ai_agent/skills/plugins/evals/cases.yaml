# plugins: with the skill loaded, the model finds a plugin before using it.
# `expect` is checked by evals/checks.py; see docs/skill_evals.md.

- description: Listing installed plugins
  vars:
    request: Which plugins do I have?
    expect:
      call: list_plugins

- description: Searching by task
  vars:
    request: Is there a plugin for image segmentation installed?
    expect:
      call: list_plugins
      args: {query: "re:segment"}

- description: A command path is read, never guessed
  vars:
    request: Run the qgis2web export
    expect:
      call: [list_plugins, describe_plugin]
      not: [run_plugin_command]

- description: Russian — what a plugin can do
  vars:
    request: Что умеет плагин QuickMapServices?
    expect:
      call: [describe_plugin, list_plugins]

- description: Nothing installed fits, so the repository is searched
  vars:
    request: I need 15-minute walking isochrones from the stations
    reads:
      steps:
        - tool: list_plugins
          args: {query: isochrones}
          result: {plugins: [], count: 0}
    expect:
      call: find_plugin
      args: {query: "re:isochron|network|routing|service area"}

- description: A found plugin is proposed for install by its key
  vars:
    request: Install a plugin for network analysis
    reads:
      steps:
        - tool: find_plugin
          args: {query: network analysis}
          result:
            plugins:
              - {plugin: QNEAT, name: QNEAT, version: "4.0", description: QGIS Network Analysis Toolbox, tags: [network analysis, isochrones], author: Clemens Raffler, downloads: 786, installed: false, active: false}
            count: 1
            repository: plugins.qgis.org
    expect:
      call: install_plugin
      args: {plugin: QNEAT}

- description: Russian — install a plugin by name
  vars:
    request: Поставь плагин QuickMapServices
    expect:
      call: [find_plugin, list_plugins]
      not: [install_plugin]
