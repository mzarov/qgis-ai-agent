name: metrics

# The plugin's public numbers, once a day: downloads per version from
# plugins.qgis.org and the repository's GitHub traffic. Neither source keeps a
# history, so tools/collect_metrics.py appends a snapshot to the `metrics`
# branch and rewrites its README and chart. No user data is involved.
#
# Traffic needs a token that may read the repository's administration data:
#   secret METRICS_TOKEN  fine-grained token, this repository, Administration: read
# Without it only downloads are collected.
#
# The branch holds data only; pushing to it starts no other workflow.

on:
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: metrics
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check out the metrics branch
        run: |
          if git fetch --depth=1 origin metrics:refs/remotes/origin/metrics; then
            git worktree add --detach metrics-data origin/metrics
          else
            git worktree add --orphan -b metrics metrics-data
          fi
      - name: Collect today's snapshot
        env:
          TRAFFIC_TOKEN: ${{ secrets.METRICS_TOKEN }}
        run: python3 tools/collect_metrics.py --data metrics-data --repo "${{ github.repository }}"
      - name: Commit and push
        working-directory: metrics-data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing new today."
          else
            git commit -q -m "Metrics for $(date -u +%F)"
            git push origin HEAD:refs/heads/metrics
          fi
