name: metrics

on:
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: metrics
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Check out the metrics branch
        run: |
          if git fetch --depth=1 origin metrics:refs/remotes/origin/metrics; then
            git worktree add --detach metrics-data origin/metrics
          else
            git worktree add --orphan -b metrics metrics-data
          fi
      - name: Collect today's snapshot
        env:
          TRAFFIC_TOKEN: ${{ secrets.METRICS_TOKEN }}
        run: python3 tools/collect_metrics.py --data metrics-data --repo "${{ github.repository }}"
      - name: Commit and push
        working-directory: metrics-data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing new today."
          else
            git commit -q -m "Metrics for $(date -u +%F)"
            git push origin HEAD:refs/heads/metrics
          fi
