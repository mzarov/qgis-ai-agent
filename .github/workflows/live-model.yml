name: live-model

on:
  workflow_dispatch:
    inputs:
      only:
        description: "Run only these scenarios (comma-separated class names); empty runs all"
        type: string
        default: ""
  workflow_call:
    secrets:
      LIVE_MODEL_KEY:
        required: false

concurrency:
  group: live-model
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  live-model:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: qgis/qgis:stable-trixie
    env:
      QT_QPA_PLATFORM: offscreen
      E2E_ARTIFACTS: build/live
      LIVE_MODEL_URL: ${{ vars.LIVE_MODEL_URL }}
      LIVE_MODEL: ${{ vars.LIVE_MODEL }}
      LIVE_MODEL_KEY: ${{ secrets.LIVE_MODEL_KEY }}
      LIVE_TOTAL_TOKENS: "1500000"
      LIVE_RUN_TOKENS: "150000"
      LIVE_ONLY: ${{ inputs.only }}
      LIVE_REQUIRE_CEILINGS: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Check the configuration
        run: |
          if [ -z "${LIVE_MODEL_URL}" ] || [ -z "${LIVE_MODEL}" ] || [ -z "${LIVE_MODEL_KEY}" ]; then
            echo "::error::Set the LIVE_MODEL_URL and LIVE_MODEL variables and the LIVE_MODEL_KEY secret."
            exit 1
          fi
      - name: Live-model scenarios in real QGIS
        run: python3 tests/real_qgis_workflows.py real_qgis_live
      - name: Upload screenshots and token usage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-model
          path: build/live
          if-no-files-found: ignore
      - name: Upload the token usage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-token-usage
          path: build/live/live_usage.json
          if-no-files-found: ignore
