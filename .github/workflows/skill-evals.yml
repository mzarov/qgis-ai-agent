name: skill-evals

on:
  workflow_dispatch:
    inputs:
      suites:
        description: "Suites to run, comma-separated (routing, style, …); empty runs all"
        type: string
        default: ""
      repeat:
        description: "Runs per case; 3 for a pass rate to set floors from"
        type: number
        default: 1
      save_thresholds:
        description: "Set the floors from this run (download evals/thresholds.json from the artifact and commit it)"
        type: boolean
        default: false
      agent:
        description: "Also run the agent bench: whole tasks in QGIS (Docker), about a million tokens"
        type: boolean
        default: false
  pull_request:
    types: [labeled]

concurrency:
  # Per label: adding any other label to the pull request must not cancel a running bench.
  group: skill-evals-${{ github.ref }}-${{ github.event.label.name || 'dispatch' }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  skill-evals:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'skill-evals'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      EVAL_API_URL: ${{ vars.LIVE_MODEL_URL }}
      EVAL_MODEL: ${{ vars.LIVE_MODEL }}
      EVAL_API_KEY: ${{ secrets.LIVE_MODEL_KEY }}
      EVAL_AUTH: ${{ vars.LIVE_MODEL_AUTH || 'Bearer' }}
      SUITES: ${{ inputs.suites }}
      REPEAT: ${{ inputs.repeat || 1 }}
      SAVE_THRESHOLDS: ${{ inputs.save_thresholds }}
      AGENT: ${{ inputs.agent }}
    steps:
      - uses: actions/checkout@v5
      - name: Check the configuration
        id: configured
        run: |
          if [ -n "${EVAL_API_URL}" ] && [ -n "${EVAL_MODEL}" ] && [ -n "${EVAL_API_KEY}" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          elif [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            echo "::error::Set the LIVE_MODEL_URL and LIVE_MODEL variables and the LIVE_MODEL_KEY secret."
            exit 1
          else
            echo "::notice::No model is configured for this repository, or this pull request comes from a fork; the skill evals are skipped."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v6
        if: steps.configured.outputs.ready == 'true'
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v5
        if: steps.configured.outputs.ready == 'true'
        with:
          node-version: "22"
      - name: Skill evals
        if: steps.configured.outputs.ready == 'true'
        run: |
          set -- --repeat "${REPEAT}" --fresh
          if [ -n "${SUITES}" ]; then set -- "$@" --suites "${SUITES}"; fi
          if [ "${SAVE_THRESHOLDS}" = "true" ]; then set -- "$@" --save-thresholds; else set -- "$@" --check; fi
          python3 evals/run.py "$@"
      - name: Agent bench
        if: steps.configured.outputs.ready == 'true' && env.AGENT == 'true'
        run: |
          set -- --agent --repeat "${REPEAT}"
          if [ "${SAVE_THRESHOLDS}" = "true" ]; then set -- "$@" --save-thresholds; else set -- "$@" --check; fi
          python3 evals/run.py "$@"
      - name: Upload the results
        if: always() && steps.configured.outputs.ready == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: skill-evals
          path: |
            build/evals/*.results.json
            build/evals/summary.md
            build/evals/agent-server.log
            evals/thresholds.json
          if-no-files-found: ignore
