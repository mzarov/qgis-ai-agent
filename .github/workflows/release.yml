name: release

# Run from the Actions tab: "release" → "Run workflow". The version comes from
# ai_agent/metadata.txt; the changelog entry of that version becomes the release
# notes. The plugin is uploaded to plugins.qgis.org first, so a rejected upload
# leaves no tag or GitHub release behind and the run can simply be repeated.

on:
  workflow_dispatch:
    inputs:
      publish_to_qgis:
        description: "Upload the zip to plugins.qgis.org (needs the QGIS_PLUGIN_TOKEN secret)"
        type: boolean
        default: true

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    env:
      PLUGIN: ai_agent
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the development environment
        run: |
          python3 -m pip install --quiet poetry==2.1.3
          poetry install --no-interaction

      - name: Tests and lint must pass before anything is published
        run: |
          poetry run python -m unittest discover -s tests -t .
          poetry run ruff check .
          poetry run ruff format --check .

      - name: Version and release notes
        id: meta
        run: |
          version=$(python3 -c "import configparser; p=configparser.ConfigParser(interpolation=None); p.read('ai_agent/metadata.txt', encoding='utf-8'); print(p['general']['version'].strip())")
          tag="v${version}"
          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            echo "::error::Tag ${tag} already exists. Bump version= in ai_agent/metadata.txt and add a changelog entry first."
            exit 1
          fi
          python3 tools/release_notes.py "${version}" > release_notes.md
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Build the plugin zip
        id: build
        run: |
          python3 tools/build_plugin.py
          zip="dist/${PLUGIN}-${{ steps.meta.outputs.version }}.zip"
          test -f "${zip}"
          echo "zip=${zip}" >> "$GITHUB_OUTPUT"

      - name: Upload to plugins.qgis.org
        if: inputs.publish_to_qgis
        env:
          QGIS_PLUGIN_TOKEN: ${{ secrets.QGIS_PLUGIN_TOKEN }}
        run: |
          if [ -z "${QGIS_PLUGIN_TOKEN}" ]; then
            echo "::error::The QGIS_PLUGIN_TOKEN secret is not set. Create a token at https://plugins.qgis.org/plugins/${PLUGIN}/tokens/ and add it under Settings → Secrets and variables → Actions."
            exit 1
          fi
          status=$(curl --silent --show-error --output response.json --write-out "%{http_code}" \
            --header "Authorization: Bearer ${QGIS_PLUGIN_TOKEN}" \
            --form "package=@${{ steps.build.outputs.zip }}" \
            "https://plugins.qgis.org/plugins/api/${PLUGIN}/version/add/")
          echo "plugins.qgis.org answered HTTP ${status}"
          cat response.json || true
          echo
          if [ "${status}" -lt 200 ] || [ "${status}" -ge 300 ]; then
            echo "::error::plugins.qgis.org rejected the upload (HTTP ${status}); nothing was tagged."
            exit 1
          fi
          if ! python3 -c "import json,sys; sys.exit(0 if json.load(open('response.json')).get('success') else 1)"; then
            echo "::error::plugins.qgis.org did not confirm the upload; nothing was tagged."
            exit 1
          fi

      - name: Tag and publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.meta.outputs.tag }}" "${{ steps.build.outputs.zip }}" \
            --target "${GITHUB_SHA}" \
            --title "${{ steps.meta.outputs.tag }}" \
            --notes-file release_notes.md
