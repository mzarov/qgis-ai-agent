name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Tests
        run: python3 -m unittest discover -s tests -t .
      - name: Lint and formatting
        if: matrix.python == '3.12'
        run: |
          python3 -m pip install --quiet ruff==0.13.3
          ruff check .
          ruff format --check .
      - name: QGIS repository scanners
        if: matrix.python == '3.12'
        run: |
          python3 -m pip install --quiet bandit detect-secrets==1.5.0
          bandit -r qgis_ai_agent -q
          git ls-files -z | xargs -0 detect-secrets-hook --baseline .secrets.baseline
      - name: Plugin build
        run: python3 tools/build_plugin.py
      - name: Archive as artifact
        if: matrix.python == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: qgis_ai_agent
          path: dist/*.zip

  real-qgis-smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        qgis_image: ["4.0-trixie", "stable-trixie"]
    container:
      image: qgis/qgis:${{ matrix.qgis_image }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - name: Installed-package smoke test in QGIS 4
        run: python3 tests/real_qgis_smoke.py
