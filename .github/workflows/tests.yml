name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install documented development environment
        run: |
          python3 -m pip install --quiet poetry==2.1.3
          poetry install --no-interaction
      - name: Tests
        run: poetry run coverage run -m unittest discover -s tests -t .
      - name: Fast-suite branch coverage reports
        if: matrix.python == '3.12'
        run: |
          poetry run coverage xml
          poetry run coverage html
      - name: Coverage as artifact
        if: matrix.python == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: fast-suite-branch-coverage
          path: |
            build/coverage.xml
            build/coverage/
      - name: Lint, formatting and boundary types
        if: matrix.python == '3.12'
        run: |
          poetry run ruff check .
          poetry run ruff format --check .
          poetry run mypy
      - name: QGIS repository scanners
        if: matrix.python == '3.12'
        run: |
          poetry run bandit -r ai_agent -q
          git ls-files -z | xargs -0 poetry run detect-secrets-hook --baseline .secrets.baseline
      - name: Plugin build
        run: python3 tools/build_plugin.py
      - name: Archive as artifact
        if: matrix.python == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: ai_agent
          path: dist/*.zip

  real-qgis-smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        qgis_image: ["4.0-trixie", "stable-trixie"]
    container:
      image: qgis/qgis:${{ matrix.qgis_image }}
    env:
      QT_QPA_PLATFORM: offscreen
      E2E_ARTIFACTS: build/e2e
    steps:
      - uses: actions/checkout@v4
      - name: Installed-package smoke test in QGIS 4
        run: python3 tests/real_qgis_smoke.py
      - name: Real QGIS workflows, end-to-end scenarios and screen structure
        run: python3 tests/real_qgis_workflows.py
      - name: Screen structure in Russian
        run: UI_LOCALE=ru python3 tests/real_qgis_workflows.py real_qgis_visual
      - name: Upload end-to-end screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screens-${{ matrix.qgis_image }}
          path: build/e2e
          if-no-files-found: ignore

  ui-pixels:
    # Pixel goldens are only valid for one font stack, so this job runs on one
    # QGIS image pinned by digest. After an intended UI change, or a new pin,
    # copy the ui-actual images of the artifact into tests/data/ui/pixels.
    runs-on: ubuntu-latest
    container:
      image: qgis/qgis@sha256:23c12670e69909e8659a5c098aa307996735a5763b9ff9c3268bdeeee1a10916  # 4.0-trixie
    env:
      QT_QPA_PLATFORM: offscreen
      E2E_ARTIFACTS: build/ui
      UI_PIXEL_BASELINE: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Screens against pixel goldens
        run: python3 tests/real_qgis_workflows.py real_qgis_visual
      - name: Screens against pixel goldens, Russian
        if: always()
        run: UI_LOCALE=ru python3 tests/real_qgis_workflows.py real_qgis_visual
      - name: Upload screens, diffs and candidates
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-pixels
          path: build/ui
          if-no-files-found: ignore
