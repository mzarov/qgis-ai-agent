name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Tests
        run: python3 -m unittest discover -s tests -t .
      - name: Lint and formatting
        if: matrix.python == '3.12'
        run: |
          python3 -m pip install --quiet ruff==0.13.3
          ruff check .
          ruff format --check .
      - name: QGIS repository scanners
        if: matrix.python == '3.12'
        run: |
          python3 -m pip install --quiet bandit detect-secrets
          cd ai_agent && bandit -r . -q
          cd .. && detect-secrets scan ai_agent/ > /dev/null
      - name: Plugin build
        run: python3 tools/build_plugin.py
      - name: Archive as artifact
        if: matrix.python == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: ai_agent
          path: dist/*.zip
