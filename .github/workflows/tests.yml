name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install documented development environment
        run: |
          python3 -m pip install --quiet poetry==2.1.3
          poetry install --no-interaction
      - name: Tests
        run: poetry run coverage run -m unittest discover -s tests -t .
      - name: Fast-suite branch coverage reports
        if: matrix.python == '3.12'
        run: |
          poetry run coverage xml
          poetry run coverage html
      - name: Coverage as artifact
        if: matrix.python == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: fast-suite-branch-coverage
          path: |
            build/coverage.xml
            build/coverage/
      - name: Lint, formatting and boundary types
        if: matrix.python == '3.12'
        run: |
          poetry run ruff check .
          poetry run ruff format --check .
          poetry run mypy
      - name: QGIS repository scanners
        if: matrix.python == '3.12'
        run: |
          poetry run bandit -r ai_agent -q
          git ls-files -z | xargs -0 poetry run detect-secrets-hook --baseline .secrets.baseline
      - name: Plugin build
        run: python3 tools/build_plugin.py
      - name: Archive as artifact
        if: matrix.python == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: ai_agent
          path: dist/*.zip

  real-qgis-smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        qgis_image: ["4.0-trixie", "stable-trixie"]
    container:
      image: qgis/qgis:${{ matrix.qgis_image }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - name: Installed-package smoke test in QGIS 4
        run: python3 tests/real_qgis_smoke.py
      - name: Real QGIS workflows
        run: python3 tests/real_qgis_workflows.py
