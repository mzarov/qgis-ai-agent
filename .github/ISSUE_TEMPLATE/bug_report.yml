name: Bug report
description: Report a reproducible problem in AI Agent
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Never paste an API key, private project data, credentials, or an unredacted provider response.
  - type: input
    id: plugin-version
    attributes:
      label: Plugin version
      placeholder: 0.0.1
    validations:
      required: true
  - type: input
    id: qgis-version
    attributes:
      label: QGIS version
      placeholder: 4.0.0
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Operating system
      placeholder: macOS 15, Windows 11, Ubuntu 24.04
    validations:
      required: true
  - type: input
    id: provider
    attributes:
      label: Model endpoint type
      description: Provider or local server and API format; do not include the key or a sensitive URL.
      placeholder: OpenAI / openai, Ollama / openai, Anthropic / anthropic
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      placeholder: Describe the smallest safe project and prompt that reproduce the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result and redacted logs
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed credentials, client data, private paths and sensitive attribute values.
          required: true
